name: Build IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only for publishing a release on tags

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned archive
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project WTD2XTD.xcodeproj \
            -scheme WTD2XTD \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/WTD2XTD.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build/xcodebuild.log

      - name: Package IPA
        run: |
          rm -rf Payload WTD2XTD.ipa
          mkdir Payload
          cp -R build/WTD2XTD.xcarchive/Products/Applications/WTD2XTD.app Payload/
          zip -qry WTD2XTD.ipa Payload
          ls -lh WTD2XTD.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WTD2XTD-ipa
          path: WTD2XTD.ipa

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log

      - name: Attach IPA to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: WTD2XTD.ipa
